name: épreuves

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  epreuves:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run verif
      - name: Épreuves unitaires
        run: npm run test
      - name: Construction
        run: npm run build
      # Le navigateur est téléchargé ici, faute d'en avoir un dans l'image ;
      # sur un poste, PW_CHROME suffit.
      - name: Navigateur
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  # Le déploiement ne part que si les épreuves passent, et seulement depuis la
  # branche principale : une branche de travail se déploie sur l'adresse de
  # prévisualisation, jamais sur celle qu'on communique.
  deploiement:
    needs: epreuves
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Sans les secrets, on ne casse pas la CI : on dit ce qui manque et on
      # s'arrête là. Le dépôt reste utilisable avant que Cloudflare soit branché.
      - name: Publier chez Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "### Déploiement non tenté" >> "$GITHUB_STEP_SUMMARY"
            echo "Les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID ne sont pas posés." >> "$GITHUB_STEP_SUMMARY"
            echo "Voir docs/exploitation.md, « Déployer chez Cloudflare »." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee sortie-deploiement.txt
          {
            echo "### Déployé"
            echo ''
            echo "L'adresse du site :"
            echo ''
            grep -Eo 'https://[a-z0-9.-]+workers\.dev' sortie-deploiement.txt | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
