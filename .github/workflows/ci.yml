name: épreuves

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  epreuves:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run verif
      - name: Épreuves unitaires
        run: npm run test
      - name: Construction
        run: npm run build
      # Le navigateur est téléchargé ici, faute d'en avoir un dans l'image ;
      # sur un poste, PW_CHROME suffit.
      - name: Navigateur
        run: npx playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  # Le déploiement ne part que si les épreuves passent, et seulement depuis la
  # branche principale : une branche de travail ne publie rien.
  pages:
    needs: epreuves
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: publication
        uses: actions/deploy-pages@v4
      - name: L’adresse du site
        run: |
          {
            echo "### En ligne"
            echo ''
            echo "${{ steps.publication.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
